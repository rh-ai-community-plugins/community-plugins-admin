{{- if and .Values.bff.enabled .Values.bff.rbac.create }}
{{- $saName := include "community-plugins-admin.bffServiceAccountName" . }}
{{- if eq $saName "default" }}
{{- fail "bff.rbac.create=true requires either bff.serviceAccount.create=true or bff.serviceAccount.name to be set (will not bind ClusterRole to the 'default' ServiceAccount)" }}
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "community-plugins-admin.fullname" . }}-bff
  labels:
    {{- include "community-plugins-admin.labels" . | nindent 4 }}
    app.kubernetes.io/component: bff
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "community-plugins-admin.fullname" . }}-bff
subjects:
  - kind: ServiceAccount
    name: {{ $saName }}
    namespace: {{ .Release.Namespace }}
{{- end }}
