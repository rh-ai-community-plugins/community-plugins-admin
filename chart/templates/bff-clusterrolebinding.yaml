{{- if and .Values.bff.enabled .Values.bff.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "community-plugins-admin.fullname" . }}-bff
  labels:
    {{- include "community-plugins-admin.labels" . | nindent 4 }}
    app.kubernetes.io/component: bff
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "community-plugins-admin.fullname" . }}-bff
subjects:
  - kind: ServiceAccount
    name: {{ include "community-plugins-admin.bffServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
