# Default values for community-plugins-admin.
# This is a YAML-formatted file.

image:
  repository: quay.io/OWNER/community-plugins-admin
  tag: ""
  pullPolicy: IfNotPresent

# Overrides .Chart.Name so deployed resources use the plugin name, not the
# chart name (which has a -chart suffix to avoid OCI registry collisions).
nameOverride: "community-plugins-admin"
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

replicaCount: 1

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

ingress:
  enabled: true
  className: nginx
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /community-plugins-admin
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

securityContext:
  runAsNonRoot: true

nodeSelector: {}

tolerations: []

affinity: {}

# BFF (Backend For Frontend) service
bff:
  enabled: true
  image:
    repository: quay.io/OWNER/community-plugins-admin-bff
    tag: ""
    pullPolicy: IfNotPresent
  replicaCount: 1
  serviceAccount:
    create: true
    annotations: {}
  service:
    type: ClusterIP
    port: 3000
    targetPort: 3000
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
